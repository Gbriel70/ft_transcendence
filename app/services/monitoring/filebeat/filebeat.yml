# ─── Filebeat configuration ────────────────────────────────────────────────────
# Collects all Docker container logs and forwards them to Logstash.

# ── Input ──────────────────────────────────────────────────────────────────────
filebeat.inputs:
  - type: container
    # Read log files for every container on this Docker host
    paths:
      - /var/lib/docker/containers/*/*.log
    # Parse Docker JSON log format (adds "stream", "time" top-level fields)
    json.message_key: log
    json.keys_under_root: true
    json.add_error_key: true

    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: false
          when.regexp:
            message: '^\s*\{'

# ── Global processors ──────────────────────────────────────────────────────────
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - drop_fields:
      fields:
        - "host.mac"
        - "agent.ephemeral_id"
        - "agent.id"
        - "agent.version"
      ignore_missing: true
  # Exclude internal ELK stack containers to avoid log loops
  - drop_event:
      when.or:
        - equals:
            container.name: "elasticsearch"
        - equals:
            container.name: "logstash"
        - equals:
            container.name: "kibana"
        - equals:
            container.name: "filebeat"
        - equals:
            container.name: "elk_setup"

# ── Output ─────────────────────────────────────────────────────────────────────
output.logstash:
  hosts: ["logstash:5044"]
  # Retry on failure
  bulk_max_size: 512

# ── Internal queue ─────────────────────────────────────────────────────────────
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level: warning
logging.to_files: false
