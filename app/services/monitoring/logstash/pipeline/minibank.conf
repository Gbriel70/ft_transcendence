# ─── MiniBank Logstash Pipeline ───────────────────────────────────────────────
#
# Flow: Filebeat → Logstash (beats:5044) → filter/enrich → Elasticsearch
#

# ── Input ─────────────────────────────────────────────────────────────────────
input {
  beats {
    port => 5044
    # Accept connections from Filebeat on the internal Docker network
  }
}

# ── Filter ────────────────────────────────────────────────────────────────────
filter {

  # ── Extract container name from Docker metadata ─────────────────────────────
  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  } else if [docker][container][name] {
    mutate {
      add_field => { "service_name" => "%{[docker][container][name]}" }
    }
  }

  # ── Drop health-check and metrics noise ─────────────────────────────────────
  if [message] =~ "(GET /health|GET /metrics|stub_status)" {
    drop {}
  }

  # ── Parse JSON log lines emitted by Node.js services ────────────────────────
  if [message] =~ /^\s*\{/ {
    json {
      source  => "message"
      target  => "app"
      skip_on_invalid_json => true
    }

    # Promote common fields to the top level for easy filtering in Kibana
    if [app][level] {
      mutate { add_field => { "log_level" => "%{[app][level]}" } }
    }
    if [app][msg] {
      mutate { add_field => { "log_message" => "%{[app][msg]}" } }
    }
    if [app][err] {
      mutate { add_field => { "error_message" => "%{[app][err]}" } }
    }

    # Parse timestamp from the application payload when available
    if [app][time] {
      date {
        match   => [ "[app][time]", "ISO8601", "UNIX_MS" ]
        target  => "@timestamp"
      }
    }
  }

  # ── Parse nginx access log lines ────────────────────────────────────────────
  if [service_name] =~ /nginx/ and [message] =~ /^\d+\.\d+\.\d+\.\d+/ {
    grok {
      match => {
        "message" => '%{IPORHOST:client_ip} - %{DATA:remote_user} \[%{HTTPDATE:nginx_time}\] "%{WORD:http_method} %{DATA:request_uri} HTTP/%{NUMBER:http_version}" %{NUMBER:response_code:int} %{NUMBER:bytes_sent:int} "%{DATA:http_referer}" "%{DATA:user_agent}"'
      }
      overwrite => ["message"]
      tag_on_failure => ["_grokparsefailure_nginx"]
    }

    if "_grokparsefailure_nginx" not in [tags] {
      date {
        match  => ["nginx_time", "dd/MMM/yyyy:HH:mm:ss Z"]
        target => "@timestamp"
      }
      mutate {
        convert => { "response_code" => "integer"
                     "bytes_sent"    => "integer" }
        add_field => { "log_level" => "info" }
      }
      if [response_code] >= 500 {
        mutate { update => { "log_level" => "error" } }
      } else if [response_code] >= 400 {
        mutate { update => { "log_level" => "warn" } }
      }
    }
  }

  # ── Classify log level from raw message when not yet set ────────────────────
  if ![log_level] {
    if [message] =~ /(?i)(error|exception|fatal|critical)/ {
      mutate { add_field => { "log_level" => "error" } }
    } else if [message] =~ /(?i)(warn|warning)/ {
      mutate { add_field => { "log_level" => "warn" } }
    } else {
      mutate { add_field => { "log_level" => "info" } }
    }
  }

  # ── Clean up noise fields ────────────────────────────────────────────────────
  mutate {
    remove_field => ["agent", "ecs", "input", "tags", "host"]
  }
}

# ── Output ────────────────────────────────────────────────────────────────────
output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"

    # ILM-managed rolling index — alias "minibank-logs" always points to the
    # active write index; old indices roll over by age / size (see setup-elk.sh)
    ilm_enabled          => true
    ilm_rollover_alias   => "minibank-logs"
    ilm_pattern          => "{now/d}-000001"
    ilm_policy           => "minibank-ilm-policy"
    
    # Retry configuration to handle transient failures
    retry_on_conflict    => 3
    action                => "index"
    document_type        => "_doc"
  }

  # Debug output to see what's being sent (uncomment for troubleshooting)
  # stdout { codec => rubydebug }
}
