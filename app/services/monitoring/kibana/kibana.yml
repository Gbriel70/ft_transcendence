# ─── Kibana configuration ─────────────────────────────────────────────────────

server.name: kibana
server.host: "0.0.0.0"
server.port: 5601

# Allow access through the nginx reverse proxy at /kibana/
server.basePath: "/kibana"
server.rewriteBasePath: true
# Trust nginx as a proxy
server.publicBaseUrl: "https://localhost:8443/kibana"

# ─── Elasticsearch connection ───────────────────────────────────────────────
# Credentials are passed via env vars ELASTICSEARCH_USERNAME / ELASTICSEARCH_PASSWORD
elasticsearch.hosts: ["http://elasticsearch:9200"]

# ─── Security ───────────────────────────────────────────────────────────────
# Enable Kibana login page (users authenticate with their Elasticsearch credentials)
xpack.security.enabled: true

# ─── Monitoring ─────────────────────────────────────────────────────────────
xpack.monitoring.enabled: false
monitoring.enabled: false

# ─── Reporting ──────────────────────────────────────────────────────────────
xpack.reporting.enabled: false

# ─── Logging ─────────────────────────────────────────────────────────────────
logging.dest: stdout
logging.verbose: false
