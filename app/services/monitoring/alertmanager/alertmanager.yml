route:
  receiver: "default"
  group_by: ["alertname", "group", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts fire immediately with a short repeat
    - matchers:
        - severity = "critical"
      receiver: "critical"
      group_wait: 10s
      repeat_interval: 1h

    # Security alerts always go to their own receiver
    - matchers:
        - group = "security"
      receiver: "security"
      group_wait: 10s
      repeat_interval: 30m

    # Blockchain / transaction alerts
    - matchers:
        - group =~ "blockchain|transactions"
      receiver: "blockchain"
      repeat_interval: 2h

    # Everything else → default
    - matchers:
        - severity = "warning"
      receiver: "default"
      repeat_interval: 4h

inhibit_rules:
  # If a critical alert fires for the same service, suppress the warning
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: ["alertname", "service", "instance"]

  # If a service is completely down, suppress all its other alerts
  - source_matchers:
      - alertname =~ ".*Down"
      - severity = "critical"
    target_matchers:
      - group =~ "application|blockchain|transactions|auth_security"
    equal: ["job"]

