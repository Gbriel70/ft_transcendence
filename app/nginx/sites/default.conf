# ==================== HTTP → HTTPS REDIRECT ====================
server {
    listen 80;
    server_name localhost;
        
    location / {
        return 301 https://$server_name:8443$request_uri;
    }
}

# ==================== HTTPS (PRINCIPAL) ====================
server {
    listen 443 ssl;
    http2 on;
    
    server_name localhost;

    # SSL
    ssl_certificate /etc/nginx/certs/minibank.crt;
    ssl_certificate_key /etc/nginx/certs/minibank.key;
    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    # ModSecurity
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/modsecurity.conf;

    # Logs
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ==================== FRONTEND ====================
    location / {
        limit_req zone=static_zone burst=50 nodelay;
        
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # Cache estático
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            modsecurity off;
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ==================== API ROUTES ====================
    
    # Auth Service
    location /api/auth/ {
        location = /api/auth/login {
            limit_req zone=login_zone burst=5 nodelay;
            
            set $auth_backend http://auth_service:3001;
            rewrite ^/api/auth/(.*) /$1 break;
            proxy_pass $auth_backend;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }
        
        location = /api/auth/register {
            limit_req zone=register_zone burst=3 nodelay;
            
            set $auth_backend http://auth_service:3001;
            rewrite ^/api/auth/(.*) /$1 break;
            proxy_pass $auth_backend;
            include /etc/nginx/conf.d/proxy-headers.conf;
        }
        
        limit_req zone=api_zone burst=20 nodelay;
        
        set $auth_backend http://auth_service:3001;
        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass $auth_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # User Service
    location /api/users/ {
        limit_req zone=api_zone burst=20 nodelay;
        
        set $user_backend http://user_service:3002;
        rewrite ^/api/users/(.*) /$1 break;
        proxy_pass $user_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Transaction Service
    location /api/tx/ {
        limit_req zone=transaction_zone burst=10 nodelay;
        
        set $tx_backend http://transition_service:3003;
        rewrite ^/api/tx/(.*) /$1 break;
        proxy_pass $tx_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Blockchain Service
    location /api/bc/ {
        limit_req zone=api_zone burst=20 nodelay;
        
        set $bc_backend http://blockchain_service:3004;
        rewrite ^/api/bc/(.*) /$1 break;
        proxy_pass $bc_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Bloquear arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}