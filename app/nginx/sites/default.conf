# ==================== HTTP → HTTPS REDIRECT ====================
server {
    listen 80;
    server_name localhost;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 301 https://$server_name:8443$request_uri;
    }
}

# ==================== HTTPS (PRINCIPAL) ====================
server {
    listen 443 ssl;
    http2 on;

    server_name localhost;

    # SSL
    ssl_certificate /etc/nginx/certs/minibank.crt;
    ssl_certificate_key /etc/nginx/certs/minibank.key;
    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/security-headers.conf;

    # ModSecurity
    modsecurity on;
    modsecurity_rules_file /etc/modsecurity.d/modsecurity.conf;

    # Logs
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ==================== FRONTEND ====================
    location / {
        limit_req zone=static_zone burst=50 nodelay;

        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        index index.html;

        # Cache estático
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            modsecurity off;
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ==================== API ROUTES ====================

    # Auth Service - Login
    location = /api/auth/login {
        modsecurity off;
        limit_req zone=login_zone burst=5 nodelay;

        set $auth_backend http://auth_service:3001;
        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass $auth_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Auth Service - Register
    location = /api/auth/register {
        modsecurity off;
        limit_req zone=register_zone burst=3 nodelay;

        set $auth_backend http://auth_service:3001;
        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass $auth_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Auth Service - Change Email
    location = /api/auth/change-email {
        modsecurity off;
        limit_req zone=api_zone burst=10 nodelay;

        set $auth_backend http://auth_service:3001;
        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass $auth_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Auth Service - Change Password
    location = /api/auth/change-password {
        modsecurity off;
        limit_req zone=api_zone burst=10 nodelay;

        set $auth_backend http://auth_service:3001;
        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass $auth_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Auth Service - Fallback (outras rotas)
    location /api/auth/ {
        limit_req zone=api_zone burst=20 nodelay;

        set $auth_backend http://auth_service:3001;
        rewrite ^/api/auth/(.*) /$1 break;
        proxy_pass $auth_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # User Service - Uploads
    location /api/users/uploads/ {
        modsecurity off;
        limit_req zone=api_zone burst=20 nodelay;

        set $user_backend http://user_service:3002;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $user_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # User Service - Me (GET/PUT)
    location = /api/users/me {
        modsecurity off;
        limit_req zone=api_zone burst=20 nodelay;

        set $user_backend http://user_service:3002;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $user_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # User Service - By Email
    location ~ ^/api/users/by-email/.+$ {
        modsecurity off;
        limit_req zone=api_zone burst=20 nodelay;

        set $user_backend http://user_service:3002;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $user_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # User Service - Me Wallet (POST)               <- ADICIONAR
    location = /api/users/me/wallet {
        modsecurity off;
        limit_req zone=api_zone burst=10 nodelay;

        set $user_backend http://user_service:3002;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $user_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # User Service - Create User (POST)
    location = /api/users {
        modsecurity off;
        limit_req zone=api_zone burst=10 nodelay;

        set $user_backend http://user_service:3002;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $user_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # User Service - By ID
    location ~ ^/api/users/[0-9]+$ {
        modsecurity off;
        limit_req zone=api_zone burst=20 nodelay;

        set $user_backend http://user_service:3002;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $user_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # User Service - By Username
    location ~ ^/api/users/by-username/.+$ {
        modsecurity off;
        limit_req zone=api_zone burst=20 nodelay;

        set $user_backend http://user_service:3002;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $user_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # User Service - Fallback
    location /api/users/ {
        modsecurity off;
        limit_req zone=api_zone burst=20 nodelay;

        set $user_backend http://user_service:3002;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $user_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Transaction Service
    location /api/tx/ {
        modsecurity off;
        limit_req zone=transaction_zone burst=10 nodelay;

        set $tx_backend http://transaction_service:3003;
        rewrite ^/api/tx/(.*) /$1 break;
        proxy_pass $tx_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # Blockchain Service
    location /api/blockchain/ {
        modsecurity off;
        limit_req zone=api_zone burst=20 nodelay;

        set $bc_backend http://blockchain_service:3004;
        rewrite ^/api/blockchain/(.*) /$1 break;
        proxy_pass $bc_backend;
        include /etc/nginx/conf.d/proxy-headers.conf;
    }

    # ==================== KIBANA (via nginx — TLS + Kibana built-in auth) ====================
    # Accessible at https://localhost:8443/kibana/
    # Auth is handled by Kibana xpack.security login page (elastic user)
    location = /kibana {
        return 301 /kibana/;
    }

    location /kibana/ {
        modsecurity off;
        proxy_pass http://kibana:5601;
        include /etc/nginx/conf.d/proxy-headers.conf;
        proxy_set_header X-Forwarded-Prefix /kibana;

        # Required for Kibana's WebSocket (real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ==================== GRAFANA (via nginx — TLS + Grafana built-in auth) ====================
    # Accessible at https://localhost:8443/grafana/
    location /grafana/ {
        modsecurity off;

        # Grafana renders inline bootstrap scripts/styles on login pages.
        # Override the app CSP for this route to avoid browser blocking.
        set $csp_header "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http: ws: wss:; worker-src 'self' blob:; frame-ancestors 'self';";

        proxy_pass http://grafana:3000;
        include /etc/nginx/conf.d/proxy-headers.conf;

        # Required for Grafana's WebSocket (real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Pass X-Script-Name so Grafana can construct proper URLs
        # Disable redirect rewriting - let browsers handle it
        proxy_redirect off;
    }

    # ==================== PROMETHEUS (via nginx — TLS + basic auth if configured) ====================
    # Accessible at https://localhost:8443/prometheus/
    location = /prometheus {
        return 301 /prometheus/;
    }

    location = /prometheus/ {
        return 302 /prometheus/graph;
    }

    location /prometheus/ {
        modsecurity off;
        rewrite ^/prometheus/(.*) /$1 break;
        proxy_pass http://prometheus:9090;
        include /etc/nginx/conf.d/proxy-headers.conf;
        proxy_set_header X-Forwarded-Prefix /prometheus;
        
        proxy_redirect ~^/ /prometheus/;
    }

    # Bloquear arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
