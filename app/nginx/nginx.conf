load_module modules/ngx_http_modsecurity_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "ms=$msec"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript;

    # Security
    server_tokens off;

    # DNS Resolver
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # WebSocket Connection Upgrade Map
    map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
    }

    # CSP Map
    map $sent_http_content_type $csp_header {
    default "";
    ~text/html "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https://localhost:8443 wss://localhost:8443";
    }

    # Includes
    include /etc/nginx/conf.d/rate-limiting.conf;
    include /etc/nginx/conf.d/security-headers.conf;
    include /etc/nginx/conf.d/ssl.conf;
    include /etc/nginx/conf.d/proxy-headers.conf;
    include /etc/nginx/sites/*.conf;
}