services:
  #====================VAULT========================#
  vault:
    build:
      context: ./app/vault
      dockerfile: dockerfile
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    cap_add:
      - IPC_LOCK
    networks:
      - minibank-network
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-c"
        - "wget -qO- http://127.0.0.1:8200/v1/sys/seal-status 2>/dev/null | grep -q '\"sealed\":false' && test -f /vault/data/.vault-ready"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: unless-stopped

  # ====================POSTGRES========================#
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: minibank_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - minibank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U admin -d minibank_db" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    restart: unless-stopped

  #==================== HARDHAT NODE =======================#
  hardhat:
    build:
      context: ./app/services/blockchain/hardhat
      dockerfile: dockerfile
    container_name: hardhat
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_KV_PATH: secret/data/blockchain
      VAULT_ROLE_ID_FILE: /vault-keys/approles/blockchain_role_id
      VAULT_SECRET_ID_FILE: /vault-keys/approles/blockchain_secret_id
    ports:
      - "8545:8545"
    volumes:
      - vault_data:/vault-keys:ro
      - hardhat_artifacts:/app/artifacts
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - minibank-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  #==================== AUTH SERVICE  ====================
  auth_service:
    build:
      context: ./app/services/auth
      dockerfile: dockerfile
    container_name: auth_service
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE_NAME: auth
      USER_SERVICE_URL: http://user_service:3002
    volumes:
      - vault_data:/vault-keys:ro
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minibank-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ==================== USER SERVICE  ====================
  user_service:
    build:
      context: ./app/services/user
      dockerfile: dockerfile
    container_name: user_service
    environment:
      VAULT_ADDR: http://vault:8200
      BLOCKCHAIN_URL: http://blockchain_service:3004
      SERVICE_NAME: user
    volumes:
      - vault_data:/vault-keys:ro
      - uploads_data:/app/uploads
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== TRANSACTION SERVICE  ====================
  transaction_service:
    build:
      context: ./app/services/transaction
      dockerfile: dockerfile
    container_name: transaction_service
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE_NAME: transaction
    volumes:
      - vault_data:/vault-keys:ro
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== BLOCKCHAIN SERVICE  ====================
  blockchain_service:
    build:
      context: ./app/services/blockchain
      dockerfile: dockerfile
    container_name: blockchain_service
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_KV_PATH: secret/data/blockchain
      VAULT_ROLE_ID_FILE: /vault-keys/approles/blockchain_role_id
      VAULT_SECRET_ID_FILE: /vault-keys/approles/blockchain_secret_id
      SERVICE_NAME: blockchain
      HARDHAT_URL: http://hardhat:8545
      SERVICE_PORT: "3004"
    ports:
      - "3004:3004"
    volumes:
      - vault_data:/vault-keys:ro
      - hardhat_artifacts:/app/artifacts:ro
    depends_on:
      vault:
        condition: service_healthy
      hardhat:
        condition: service_healthy
      auth_service:
        condition: service_started
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== NGINX WAF====================
  nginx:
    build:
      context: ./app
      dockerfile: nginx/dockerfile
    container_name: nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - auth_service
      - user_service
      - transaction_service
      - blockchain_service
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== PROMETHEUS ====================
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./app/services/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./app/services/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - node_exporter
      - cadvisor
      - nginx_exporter
      - alertmanager
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== ALERTMANAGER ====================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./app/services/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== GRAFANA ====================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./app/services/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./app/services/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== NODE EXPORTER ====================
  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node_exporter
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== CADVISOR ====================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== NGINX EXPORTER ====================
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx_exporter
    command:
      - "-nginx.scrape-uri=http://nginx:80/stub_status"
    depends_on:
      - nginx
    networks:
      - minibank-network
    restart: unless-stopped

networks:
  minibank-network:
    driver: bridge

volumes:
  postgres_data:
  vault_data:
  vault_logs:
  grafana_data:
  uploads_data:
  hardhat_artifacts:
