services:
  #====================VAULT========================#
  vault:
    build:
      context: ./app/vault
      dockerfile: dockerfile
    container_name: vault
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    cap_add:
      - IPC_LOCK
    networks:
      - minibank-network
    healthcheck:
      test:
        - "CMD"
        - "sh"
        - "-c"
        - "wget -qO- http://127.0.0.1:8200/v1/sys/seal-status 2>/dev/null | grep -q '\"sealed\":false' && test -f /vault/data/.vault-ready"
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    restart: unless-stopped

  # ====================POSTGRES========================#
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: minibank_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - minibank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U admin -d minibank_db" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 120s
    restart: unless-stopped

  #==================== HARDHAT NODE =======================#
  hardhat:
    build:
      context: ./app/services/blockchain/hardhat
      dockerfile: dockerfile
    container_name: hardhat
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_KV_PATH: secret/data/blockchain
      VAULT_ROLE_ID_FILE: /vault-keys/approles/blockchain_role_id
      VAULT_SECRET_ID_FILE: /vault-keys/approles/blockchain_secret_id
    ports:
      - "8545:8545"
    volumes:
      - vault_data:/vault-keys:ro
      - hardhat_artifacts:/app/artifacts
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - minibank-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8545"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  #==================== AUTH SERVICE  ====================
  auth_service:
    build:
      context: ./app/services/auth
      dockerfile: dockerfile
    container_name: auth_service
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE_NAME: auth
      USER_SERVICE_URL: http://user_service:3002
      # GDPR email settings — set these in your .env file to enable outgoing emails
      APP_URL: ${APP_URL:-https://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@minibank.local}
    volumes:
      - vault_data:/vault-keys:ro
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minibank-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ==================== USER SERVICE  ====================
  user_service:
    build:
      context: ./app/services/user
      dockerfile: dockerfile
    container_name: user_service
    environment:
      VAULT_ADDR: http://vault:8200
      BLOCKCHAIN_URL: http://blockchain_service:3004
      SERVICE_NAME: user
    volumes:
      - vault_data:/vault-keys:ro
      - uploads_data:/app/uploads
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== TRANSACTION SERVICE  ====================
  transaction_service:
    build:
      context: ./app/services/transaction
      dockerfile: dockerfile
    container_name: transaction_service
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE_NAME: transaction
    volumes:
      - vault_data:/vault-keys:ro
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== BLOCKCHAIN SERVICE  ====================
  blockchain_service:
    build:
      context: ./app/services/blockchain
      dockerfile: dockerfile
    container_name: blockchain_service
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_KV_PATH: secret/data/blockchain
      VAULT_ROLE_ID_FILE: /vault-keys/approles/blockchain_role_id
      VAULT_SECRET_ID_FILE: /vault-keys/approles/blockchain_secret_id
      SERVICE_NAME: blockchain
      HARDHAT_URL: http://hardhat:8545
      SERVICE_PORT: "3004"
    ports:
      - "3004:3004"
    volumes:
      - vault_data:/vault-keys:ro
      - hardhat_artifacts:/app/artifacts:ro
    depends_on:
      vault:
        condition: service_healthy
      hardhat:
        condition: service_healthy
      auth_service:
        condition: service_started
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== NGINX WAF====================
  nginx:
    build:
      context: ./app
      dockerfile: nginx/dockerfile
    container_name: nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - auth_service
      - user_service
      - transaction_service
      - blockchain_service
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== PROMETHEUS ====================
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./app/services/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./app/services/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - node_exporter
      - cadvisor
      - nginx_exporter
      - alertmanager
      - postgres_exporter
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== ALERTMANAGER ====================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./app/services/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== GRAFANA ====================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./app/services/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./app/services/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== NODE EXPORTER ====================
  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node_exporter
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== CADVISOR ====================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== NGINX EXPORTER ====================
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx_exporter
    command:
      - "-nginx.scrape-uri=http://nginx:80/stub_status"
    depends_on:
      - nginx
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== POSTGRES EXPORTER ====================
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://admin:admin123@postgres:5432/minibank_db?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== ELASTICSEARCH ====================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.20
    container_name: elasticsearch
    environment:
      - cluster.name=minibank-logs
      - node.name=elasticsearch
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-minibank_elastic}
      - xpack.security.enabled=true
      - xpack.monitoring.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elk_data:/usr/share/elasticsearch/data
      - ./app/services/monitoring/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    ports:
      - "9200:9200"
    networks:
      - minibank-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u elastic:${ELASTIC_PASSWORD:-minibank_elastic} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ==================== LOGSTASH ====================
  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.20
    container_name: logstash
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-minibank_elastic}
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - ./app/services/monitoring/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./app/services/monitoring/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== KIBANA ====================
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.20
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-minibank_elastic}
      - xpack.security.enabled=true
      - xpack.monitoring.enabled=false
    volumes:
      - ./app/services/monitoring/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== FILEBEAT ====================
  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.20
    container_name: filebeat
    user: root
    command: filebeat -e -strict.perms=false
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-minibank_elastic}
    volumes:
      - ./app/services/monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - logstash
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== ELK SETUP (one-shot) ====================
  elk_setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.20
    container_name: elk_setup
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-minibank_elastic}
    volumes:
      - ./app/services/monitoring/elk/setup-elk.sh:/setup-elk.sh:ro
    entrypoint: ["/bin/bash", "/setup-elk.sh"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - minibank-network
    restart: "no"

networks:
  minibank-network:
    driver: bridge

volumes:
  postgres_data:
  vault_data:
  vault_logs:
  grafana_data:
  uploads_data:
  hardhat_artifacts:
  elk_data:
