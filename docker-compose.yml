services:
  #====================VAULT========================#
  vault:
    build:
      context: ./app/vault
      dockerfile: dockerfile
    container_name: vault
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - SKIP_SETCAP=true
    cap_add:
      - IPC_LOCK
    networks:
      - minibank-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ====================POSTGRES========================#
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: minibank_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh:ro
    networks:
      - minibank-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d minibank_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  #==================== AUTH SERVICE  ====================
  auth_service:
    build:
      context: ./app/services/auth
      dockerfile: dockerfile
    container_name: auth_service
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE_NAME: auth
      USER_SERVICE_URL: http://user_service:3002
    volumes:
      - vault_data:/vault-keys:ro
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== USER SERVICE  ====================
  user_service:
    build:
      context: ./app/services/user
      dockerfile: dockerfile
    container_name: user_service
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE_NAME: user
    volumes:
      - vault_data:/vault-keys:ro
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== TRANSITION SERVICE  ====================
  transition_service:
    build:
      context: ./app/services/transition
      dockerfile: dockerfile
    container_name: transition_service
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE_NAME: transition
    volumes:
      - vault_data:/vault-keys:ro
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== BLOCKCHAIN SERVICE  ====================
  blockchain_service:
    build:
      context: ./app/services/blockchain
      dockerfile: dockerfile
    container_name: blockchain_service
    environment:
      VAULT_ADDR: http://vault:8200
      SERVICE_NAME: blockchain
    volumes:
      - vault_data:/vault-keys:ro
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== NGINX WAF====================
  nginx:
    build:
      context: ./app
      dockerfile: nginx/dockerfile
    container_name: nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - nginx_certs:/etc/nginx/certs
    depends_on:
      - auth_service
      - user_service
      - transition_service
      - blockchain_service
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== PROMETHEUS ====================
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./app/services/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./app/services/monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - node_exporter
      - cadvisor
      - nginx_exporter
      - alertmanager
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== ALERTMANAGER ====================
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./app/services/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== GRAFANA ====================
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./app/services/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./app/services/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== NODE EXPORTER ====================
  node_exporter:
    image: prom/node-exporter:v1.8.1
    container_name: node_exporter
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== CADVISOR ====================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - minibank-network
    restart: unless-stopped

  # ==================== NGINX EXPORTER ====================
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: nginx_exporter
    command:
      - "-nginx.scrape-uri=http://nginx:80/stub_status"
    depends_on:
      - nginx
    networks:
      - minibank-network
    restart: unless-stopped

networks:
  minibank-network:
    driver: bridge

volumes:
  postgres_data:
  nginx_certs:
  vault_data:
  vault_logs:
  grafana_data: